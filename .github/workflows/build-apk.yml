name: Build Android APK

# ─── Auto-build trigger ────────────────────────────────────────────────
# Runs automatically on every push to main/master and on every PR.
# A tagged release can also be triggered manually via workflow_dispatch.
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag / version, e.g. v1.1.0'
        required: true
        type: string

permissions:
  contents: write

# Pinned Flutter version — must match what subosito/flutter-action installs.
env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Show versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      # Build a single fat APK for all ABIs (simpler than split-per-abi).
      # This produces ONE .apk file that works on arm64, armv7, and x86_64
      # — perfect for Android tablets (arm64) and any other Android device.
      # --android-skip-build-dependency-validation: bypasses Flutter's
      # build-time version checks (Gradle, AGP, Java, v1 embedding).
      # The actual compatibility is governed by the versions pinned in:
      #   - android/gradle/wrapper/gradle-wrapper.properties (Gradle 8.14.3)
      #   - android/settings.gradle.kts (AGP 8.13.0, Kotlin 2.1.0)
      - name: Build APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Rename APK
        run: |
          cd build/app/outputs/flutter-apk
          mv app-release.apk Streak-android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: streak-android-apk
          path: build/app/outputs/flutter-apk/Streak-android.apk
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    # Only when manually dispatched with a tag.
    if: github.event_name == 'workflow_dispatch'

    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      # Patch jni build-id for reproducible builds (F-Droid compatibility).
      - name: Patch jni build-id
        run: sed -i -e 's/-Wl,/-Wl,--build-id=none,/' "$PUB_CACHE"/hosted/pub.dev/jni-*/src/CMakeLists.txt

      # Sign the release APK with the release keystore (kept in GitHub Secrets).
      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/streak-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=streak-release.jks
          EOF

      # Build a single fat APK (all ABIs in one file).
      - name: Build APK
        run: flutter build apk --release --split-debug-info=build/symbols --android-skip-build-dependency-validation

      - name: Rename APK
        run: |
          cd build/app/outputs/flutter-apk
          mv app-release.apk Streak-android.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/Streak-android.apk
