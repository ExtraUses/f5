name: Build Android APK

# ─── Auto-build trigger ────────────────────────────────────────────────
# Runs automatically on every push to main/master and on every PR.
# A tagged release can also be triggered manually via workflow_dispatch.
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag / version, e.g. v1.1.0'
        required: true
        type: string

permissions:
  contents: write

# Pinned Flutter version — must match what subosito/flutter-action installs.
env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    # First run downloads the NDK (~1.5 GB) + Gradle deps.
    # 45 min gives plenty of headroom. Future runs use the cache
    # and finish in ~5-7 min.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk
          # Key includes Flutter version so the cache invalidates when
          # Flutter's required NDK version changes.
          key: ndk-flutter-${{ env.FLUTTER_VERSION }}

      - name: Show versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        continue-on-error: true
        run: flutter test

      # Build APK for arm64 ONLY — this is the architecture used by
      # virtually all modern Android tablets (Samsung Galaxy Tab,
      # Lenovo Tab, etc.). Skipping armv7 and x86_64 cuts the native
      # C++ compilation time by ~2/3 (from ~10 min to ~3 min).
      # --no-tree-shake-icons: skips icon analysis (saves ~30 sec).
      # --android-skip-build-dependency-validation: bypasses version checks.
      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Rename APK
        run: |
          cd build/app/outputs/flutter-apk
          mv app-release.apk Streak-android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: streak-android-apk
          path: build/app/outputs/flutter-apk/Streak-android.apk
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Only when manually dispatched with a tag.
    if: github.event_name == 'workflow_dispatch'

    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk
          key: ndk-flutter-${{ env.FLUTTER_VERSION }}

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      # Patch jni build-id for reproducible builds (F-Droid compatibility).
      - name: Patch jni build-id
        run: sed -i -e 's/-Wl,/-Wl,--build-id=none,/' "$PUB_CACHE"/hosted/pub.dev/jni-*/src/CMakeLists.txt

      # Sign the release APK with the release keystore (kept in GitHub Secrets).
      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/streak-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=streak-release.jks
          EOF

      # Build APK for arm64 only (same optimization as the build job).
      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons --split-debug-info=build/symbols --android-skip-build-dependency-validation

      - name: Rename APK
        run: |
          cd build/app/outputs/flutter-apk
          mv app-release.apk Streak-android.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/Streak-android.apk
