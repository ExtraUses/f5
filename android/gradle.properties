org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Skip NDK native compilation — the jni package ships pre-built .so
# files for arm64, so we don't need to compile from source. This
# eliminates the ~5-8 min native compilation step that keeps getting
# killed by GitHub Actions runner shutdowns.
android.builder.sdkDownload=false
