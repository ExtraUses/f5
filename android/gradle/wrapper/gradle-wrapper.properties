distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
# Gradle 8.14.3 — compatible with AGP 8.13.0 (declared in
# settings.gradle.kts). AGP 8.13 requires Gradle 8.13+, so 8.14.3
# satisfies the constraint with headroom.
#
# Flutter 3.47.7 warns that Gradle < 9.1 will "soon" be dropped, but
# upgrading to Gradle 9.x requires AGP 9.x (the new Android DSL
# migration). Stay on Gradle 8.x + AGP 8.x until the project is ready
# for that migration.
#
# The distributionSha256Sum line is intentionally omitted. Flutter's
# Gradle plugin validates the wrapper on every build, and pinning the
# SHA256 here meant every Gradle point-update was a manual checksum
# update that broke CI. If you want supply-chain verification, run:
#
#   ./gradlew wrapper --gradle-version=8.14.3 --distribution-type=all
#
# locally — Gradle will re-add the correct `distributionSha256Sum` line.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-all.zip
